# WARNING: Do NOT commit real credentials here.
# In production, populate secrets from AWS Secrets Manager via External Secrets Operator
# or use sealed-secrets. This file is a template for local/Minikube use only.
apiVersion: v1
kind: Secret
metadata:
  name: payments-secret
  namespace: payments
type: Opaque
stringData:
  # base64-encode real values in production; stringData is auto-encoded by k8s
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/payments"
